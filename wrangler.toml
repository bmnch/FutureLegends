# CiviorAI — Cloudflare Workers (OpenNext) for Next.js App Router edge
name = "civior-ai"
main = ".open-next/worker.js"
compatibility_date = "2026-09-19"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "civior-db"
database_id = "ee102c7c-5afe-4c20-a02d-e278eedb38c6"
migrations_dir = "drizzle"

[observability]
enabled = true

# Pages project alias used by Wrangler Pages commands
[vars]
APP_NAME = "CiviorAI"
